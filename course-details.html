
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS | Course Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2 class="logo">LearnHub</h2>

            <nav>
                <a href="index.html">🏠 Dashboard</a>
                <a href="index.html">📚 My Courses</a>
                <a href="courses.html" class="active">🔍 Explore Courses</a>
                <a href="#">📊 My Progress</a>
                <a href="#">👤 My Profile</a>
            </nav>

            <a href="#" class="logout">🚪 Logout</a>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <a href="courses.html" class="back-link">
                ← Back to Courses
            </a>

            <!-- Course Information -->
            <section class="course-detail-hero">

                <span id="detailIcon">💻</span>

                <p id="detailCategory">Programming</p>

                <h1 id="detailTitle">Web Development</h1>

                <p id="detailDescription">
                    Learn modern web development.
                </p>

                <div class="course-meta">
                    <span id="detailLevel">Beginner</span>
                    <span id="detailDuration">8 Weeks</span>
                    <span id="detailPrice">Free</span>
                </div>

                <button id="enrollButton">
                    Enroll Now
                </button>

                <p id="enrollMessage" hidden></p>

            </section>


            <!-- Course Overview -->
            <section class="detail-section">

                <h2>About This Course</h2>

                <p id="detailAbout"></p>

            </section>


            <!-- Learning Objectives -->
            <section class="detail-section">

                <h2>What You Will Learn</h2>

                <ul id="learningObjectives"></ul>

            </section>


            <!-- Course Curriculum -->
            <section class="detail-section">

                <h2>Course Curriculum</h2>

                <div id="courseCurriculum"></div>

            </section>


            <!-- Instructor -->
            <section class="detail-section">

                <h2>Instructor</h2>

                <div class="instructor-card">

                    <span>👨‍🏫</span>

                    <div>
                        <h3 id="instructorName"></h3>
                        <p id="instructorRole"></p>
                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
